# cargo-deny configuration for Zipora (Rule B5)

[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
ignore = [
    # bincode 1.3.3 is marked unmaintained; ignored (no fix exists) — retained for bincode 1.x wire compatibility
    { id = "RUSTSEC-2025-0141", reason = "ignored (no fix exists): bincode 1.3.3 is final 1.x release; retained for wire format compatibility" },
    # lru 0.16.4 is a transitive dev-dependency pulled only by tantivy 0.26.2 (pinned to lru ^0.16.3 for E1.1 bench)
    { id = "RUSTSEC-2026-0253", reason = "ignored (no fix in tantivy 0.26.2): transitive dev-dependency lru 0.16.4 via tantivy 0.26.2 (bench-only)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
]

[[licenses.clarify]]
crate = "zipora"
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0xe304124d },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
