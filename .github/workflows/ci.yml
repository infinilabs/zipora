name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Cache cargo & target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Clippy (all targets, all features, deny warnings)
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Test (debug, all features)
      run: cargo test --locked --all-features

    - name: Test (release, all features, lib)
      run: cargo test --locked --release --all-features --lib

    - name: Test (doctests)
      run: cargo test --locked --doc

    - name: Verify FFI cbindgen header sync & C smoke caller (C11 / F3)
      run: cargo test --locked --test ffi_c_smoke --features ffi

  feature_matrix:
    name: Feature Matrix & MSRV 1.95 (B4)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust stable and MSRV 1.95 toolchains
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable, 1.95.0
        components: clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Cache cargo & target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-b4-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run B4 feature matrix and MSRV 1.95 gate
      run: make feature_matrix

  # The job above builds the committed Cargo.lock. This one runs
  # `cargo update` first, so it tests the newest versions Cargo.toml allows
  # and shows drift between lock refreshes (Makefile `update` target). It does
  # not block merges. Pattern from the Cargo book, "Verifying Latest
  # Dependencies" (guide/continuous-integration.html).
  latest_deps:
    name: Latest Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Update Cargo.lock to the latest compatible versions
      run: cargo update --verbose

    - name: Test (debug, all features)
      run: cargo test --all-features

