name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Cache cargo & target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Clippy (all targets, all features, deny warnings)
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Docs (all features, deny rustdoc warnings - B6)
      run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

    - name: Test (debug, all features)
      run: cargo test --locked --all-features

    - name: Test (release, all features, lib)
      run: cargo test --locked --release --all-features --lib

    - name: Test (doctests)
      run: cargo test --locked --doc

    - name: Test (markdown doctests across README & docs/*.md)
      run: python3 scripts/doc_tests.py

    - name: Verify FFI cbindgen header sync & C smoke caller (C11 / F3)
      run: cargo test --locked --test ffi_c_smoke --features ffi

  feature_matrix:
    name: Feature Matrix & MSRV 1.95 (B4)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust MSRV 1.95 toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0

    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Cache cargo & target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-b4-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run B4 feature matrix and MSRV 1.95 gate
      run: make feature_matrix

  supply_chain:
    name: Supply Chain Audit & Deny (B5)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo audit & deny binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/cargo-audit
          ~/.cargo/bin/cargo-deny
        key: ${{ runner.os }}-cargo-supply-chain-v1

    - name: Install cargo-audit and cargo-deny
      run: |
        command -v cargo-audit >/dev/null 2>&1 || cargo install --locked cargo-audit
        command -v cargo-deny >/dev/null 2>&1 || cargo install --locked cargo-deny

    - name: Run B5 cargo audit and cargo deny check
      run: |
        cargo audit
        cargo deny check

  # The job above builds the committed Cargo.lock. This one runs
  # `cargo update` first, so it tests the newest versions Cargo.toml allows
  # and shows drift between lock refreshes (Makefile `update` target). It does
  # not block merges. Pattern from the Cargo book, "Verifying Latest
  # Dependencies" (guide/continuous-integration.html).
  latest_deps:
    name: Latest Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Update Cargo.lock to the latest compatible versions
      run: cargo update --verbose

    - name: Test (debug, all features)
      run: cargo test --all-features

